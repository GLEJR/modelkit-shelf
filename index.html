<!doctype html>
<!--
  ModelKit Companion: a public shelf. One static file, published to GitHub Pages (GLEJR/modelkit-shelf).
  The shelf's code comes after the # in the link, so it never reaches GitHub's servers. The page asks
  Supabase's get_shelf(code) for that one shelf with the project's publishable key, which is public by
  design: row-level security and get_shelf decide what anyone can read. No tracking, no cookies.
  Everything the user wrote is set with textContent, never as HTML.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://zntugnlwedaishttqosn.supabase.co; connect-src https://zntugnlwedaishttqosn.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Shelf &middot; ModelKit Companion</title>
<style>
  :root { --bg: #0e0d12; --ink: #f4f1ea; --dim: #a8a3b3; --gold: #e8c468; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 32px 20px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; }
  #sub { color: var(--dim); font-size: 14px; margin-top: 4px; }
  main { display: grid; gap: 14px; padding: 16px 20px 40px; max-width: 1200px; margin: 0 auto;
         grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .card { position: relative; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden;
          background: linear-gradient(135deg, #2a2638, #0e0d12); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .card .type { position: absolute; top: 36%; width: 100%; text-align: center; font-weight: 700;
                letter-spacing: .08em; color: rgba(255,255,255,.25); text-transform: uppercase; padding: 0 12px; }
  .card .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
                background: linear-gradient(to bottom, transparent, rgba(0,0,0,.6) 55%, rgba(0,0,0,.9)); }
  .badge { position: absolute; top: 12px; left: 12px; padding: 5px 11px; border-radius: 999px;
           font-size: 11px; font-weight: 700; letter-spacing: .12em; background: var(--ink); color: #15141a; }
  .badge.done { background: var(--gold); }
  .text { position: absolute; left: 14px; right: 14px; bottom: 14px; }
  .title { font-size: 20px; font-weight: 700; line-height: 1.15;
           display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .details, .stats { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .details { color: rgba(255,255,255,.8); margin-top: 4px; }
  .stats { font-weight: 700; margin-top: 4px; }
  .message { grid-column: 1 / -1; color: var(--dim); text-align: center; padding: 60px 0; }
  footer { text-align: center; color: var(--dim); font-size: 12px; padding: 0 0 32px; }
</style>
</head>
<body>
<header><h1 id="title">Shelf</h1><div id="sub"></div></header>
<main id="shelf"><div class="message">Loading&hellip;</div></main>
<footer>made with ModelKit Companion</footer>
<script>
(function () {
  "use strict";
  var API = "https://zntugnlwedaishttqosn.supabase.co";
  var KEY = "sb_publishable_MqNMFLSIKB6f0R2pB0sbnQ_PnKHA3CL"; // publishable: safe to be public
  var CODE = /^[a-hjkmnp-z2-9]{12}$/;
  var PHOTO = /^[A-Za-z0-9-]+\/[A-Za-z0-9-]+\.jpg$/;

  var shelf = document.getElementById("shelf");

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }

  function message(text) {
    shelf.textContent = "";
    shelf.appendChild(el("div", "message", text));
  }

  function card(item) {
    var c = el("article", "card");
    if (typeof item.photo === "string" && PHOTO.test(item.photo)) {
      var img = el("img");
      img.alt = "";
      img.loading = "lazy";
      img.src = API + "/storage/v1/object/public/shelf/" + item.photo;
      c.appendChild(img);
    } else {
      c.appendChild(el("div", "type", (item.details || "").split(" · ").pop()));
    }
    c.appendChild(el("div", "fade"));
    c.appendChild(el("div", item.finished ? "badge done" : "badge", item.finished ? "FINISHED" : "WORK IN PROGRESS"));
    var t = el("div", "text");
    t.appendChild(el("div", "title", item.title || "Untitled kit"));
    if (item.details) t.appendChild(el("div", "details", item.details));
    var stats = [item.stage, item.hours ? item.hours + " of work" : null].filter(Boolean).join("  ·  ");
    if (stats) t.appendChild(el("div", "stats", stats));
    c.appendChild(t);
    return c;
  }

  function show(data) {
    if (!data || !Array.isArray(data.items)) {
      message("This shelf isn't here. The link may have been reset or turned off.");
      return;
    }
    var title = typeof data.title === "string" && data.title ? data.title : "Shelf";
    document.getElementById("title").textContent = title;
    document.title = title + " · ModelKit Companion";
    var n = data.items.length;
    var done = data.items.filter(function (i) { return i && i.finished; }).length;
    document.getElementById("sub").textContent =
      n + (n === 1 ? " kit" : " kits") + (done ? ", " + done + " finished" : "");
    shelf.textContent = "";
    if (!n) { message("Nothing on this shelf yet."); return; }
    data.items.forEach(function (i) { if (i && typeof i === "object") shelf.appendChild(card(i)); });
  }

  function load() {
    var code = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
    if (!CODE.test(code)) { message("This link is missing its shelf code. Check you copied all of it."); return; }
    message("Loading…");
    fetch(API + "/rest/v1/rpc/get_shelf", {
      method: "POST",
      headers: { "apikey": KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: code }),
      referrerPolicy: "no-referrer",
      credentials: "omit"
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(show)
      .catch(function () { message("Couldn't load this shelf. Try again in a moment."); });
  }

  window.addEventListener("hashchange", load);
  load();
})();
</script>
</body>
</html>

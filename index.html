<!doctype html>
<!--
  Plinth: a public shelf. One static file, published to GitHub Pages (GLEJR/modelkit-shelf).
  The shelf's code comes after the # in the link, so it never reaches GitHub's servers. The page asks
  Supabase's get_shelf(code) for that one shelf with the project's publishable key, which is public by
  design: row-level security and get_shelf decide what anyone can read. No tracking, no cookies.
  Everything the user wrote is set with textContent, never as HTML.

  Themes (Gary, 2026-11-19: build all of them, each user picks): classic (free), case, wall, bench
  (Pro). The phone publishes the theme in get_shelf's answer; an unknown or missing one is Classic.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https://zntugnlwedaishttqosn.supabase.co; connect-src https://zntugnlwedaishttqosn.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="robots" content="noindex">
<title>Shelf &middot; Plinth</title>
<style>
  :root { --ink: #f4f1ea; --dim: #a8a3b3; --gold: #e8c468; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .message { grid-column: 1 / -1; text-align: center; padding: 60px 20px; }
  .ph { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .type { position: absolute; top: 36%; width: 100%; text-align: center; font-weight: 700; letter-spacing: .08em;
          text-transform: uppercase; padding: 0 12px; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* ---- Classic (free): the dark page with Gallery cards ---- */
  body.t-classic { background: #0e0d12; color: var(--ink); }
  .t-classic header { padding: 32px 20px 8px; max-width: 1200px; margin: 0 auto; }
  .t-classic h1 { margin: 0; font-size: 28px; }
  .t-classic #sub { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .t-classic main { display: grid; gap: 14px; padding: 16px 20px 40px; max-width: 1200px; margin: 0 auto;
         grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
  .t-classic .message, .t-classic footer { color: var(--dim); }
  .t-classic footer { text-align: center; font-size: 12px; padding: 0 0 32px; }
  .t-classic .card { position: relative; aspect-ratio: 4 / 5; border-radius: 14px; overflow: hidden;
          background: linear-gradient(135deg, #2a2638, #0e0d12); }
  .t-classic .type { color: rgba(255,255,255,.25); }
  .t-classic .fade { position: absolute; left: 0; right: 0; bottom: 0; height: 55%;
                background: linear-gradient(to bottom, transparent, rgba(0,0,0,.6) 55%, rgba(0,0,0,.9)); }
  .t-classic .badge { position: absolute; top: 12px; left: 12px; padding: 5px 11px; border-radius: 999px;
           font-size: 11px; font-weight: 700; letter-spacing: .12em; background: var(--ink); color: #15141a; }
  .t-classic .badge.done { background: var(--gold); }
  .t-classic .text { position: absolute; left: 14px; right: 14px; bottom: 14px; }
  .t-classic .title { font-size: 20px; font-weight: 700; line-height: 1.15; }
  .t-classic .details, .t-classic .stats { font-size: 13px; }
  .t-classic .details { color: rgba(255,255,255,.8); margin-top: 4px; }
  .t-classic .stats { font-weight: 700; margin-top: 4px; }

  /* ---- Display Case (Pro): a lit cabinet, kits on shelves ---- */
  body.t-case { background: #0b0a0f; color: var(--ink); }
  .t-case header { padding: 26px 18px 6px; max-width: 900px; margin: 0 auto; }
  .t-case h1 { margin: 0; font-size: 26px; }
  .t-case #sub { color: var(--dim); font-size: 14px; margin-top: 4px; }
  .t-case main { max-width: 900px; margin: 16px auto 0; padding: 0 12px; }
  .t-case .message, .t-case footer { color: #6f6a7a; }
  .t-case footer { text-align: center; font-size: 12px; padding: 22px 0 26px; }
  .t-case .row { display: grid; grid-template-columns: repeat(var(--cols, 2), 1fr); gap: 10px; padding: 14px 10px 0;
          background: linear-gradient(#1a1722, #121018); border-left: 1px solid #2a2633; border-right: 1px solid #2a2633; }
  .t-case .row:first-child { border-top: 1px solid #2a2633; border-radius: 10px 10px 0 0;
          box-shadow: inset 0 18px 30px -10px rgba(255,230,170,.12); }
  .t-case .plank { height: 12px; margin: 0 12px; background: linear-gradient(#3b3346, #1b1822);
          border-radius: 0 0 4px 4px; box-shadow: 0 6px 14px rgba(0,0,0,.6); }
  .t-case .it { position: relative; aspect-ratio: 4 / 5; }
  .t-case .it .frame { position: absolute; inset: 22px 0 22px; overflow: hidden; border-radius: 4px;
          background: linear-gradient(135deg, #2a2638, #14121a); }
  .t-case .type { color: rgba(255,255,255,.25); font-size: 12px; }
  .t-case .glow { position: absolute; left: 10%; right: 10%; bottom: 14px; height: 30%; pointer-events: none;
          background: radial-gradient(ellipse at bottom, rgba(232,196,104,.35), transparent 70%); }
  .t-case .st { position: absolute; left: 0; right: 0; top: 4px; text-align: center; font-size: 10px;
          letter-spacing: .14em; color: var(--gold); }
  .t-case .st.w { color: var(--dim); }
  .t-case .nm { position: absolute; left: 4px; right: 4px; bottom: 2px; text-align: center; font-size: 12px; font-weight: 700; }

  /* ---- Gallery Wall (Pro): framed pieces on a plain wall ---- */
  body.t-wall { background: #f3f0ea; color: #1d1b20; }
  .t-wall header { padding: 34px 22px 10px; text-align: center; max-width: 900px; margin: 0 auto; }
  .t-wall h1 { margin: 0; font: 400 30px/1.1 Georgia, "Times New Roman", serif; letter-spacing: .02em; }
  .t-wall #sub { margin: 8px 0 0; color: #7a746c; font: italic 14px Georgia, serif; }
  .t-wall main { max-width: 900px; margin: 0 auto; padding: 0 0 20px; }
  .t-wall .message, .t-wall footer { color: #9a9489; font: italic 13px Georgia, serif; }
  .t-wall footer { text-align: center; padding: 10px 0 30px; }
  .t-wall .piece { margin: 26px 34px 0; }
  .t-wall .frame { position: relative; aspect-ratio: 4 / 5; background: #fff; padding: 16px; border: 7px solid #2a2622;
          box-shadow: 0 1px 0 #d8d2c6, 0 14px 28px -12px rgba(0,0,0,.35); }
  .t-wall .frame .in { position: relative; width: 100%; height: 100%; overflow: hidden;
          background: linear-gradient(135deg, #f7f4ee, #e3ddd2); }
  .t-wall .type { color: rgba(0,0,0,.25); }
  .t-wall .plaque { margin: 12px 4px 0; display: flex; justify-content: space-between; gap: 12px; }
  .t-wall .plaque .t { font: 600 16px/1.2 Georgia, serif; }
  .t-wall .plaque .d { font-size: 12px; color: #7a746c; margin-top: 3px; }
  .t-wall .plaque .s { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: #7a746c;
          text-align: right; white-space: nowrap; }
  .t-wall .plaque .s b { display: block; color: #a07a1e; }
  .t-wall .small { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px;
          margin: 26px 24px 0; align-items: start; }
  .t-wall .small .piece { margin: 0; }
  .t-wall .small .frame { padding: 9px; border-width: 5px; }
  .t-wall .small .plaque { display: block; }
  .t-wall .small .plaque .t { font-size: 14px; }
  .t-wall .small .plaque .s { text-align: left; margin-top: 5px; }
  .t-wall .small .plaque .s b { display: inline; margin-right: 6px; }

  /* ---- Workbench (Pro): trays on a cutting mat ---- */
  body.t-bench { color: #eef2ea; background-color: #1f3a2e;
          background-image: linear-gradient(#2f5a46 1px, transparent 1px), linear-gradient(90deg, #2f5a46 1px, transparent 1px);
          background-size: 24px 24px; }
  .t-bench .tape { height: 16px; background: repeating-linear-gradient(-45deg, #e8c468 0 12px, #1b1a1f 12px 24px); }
  .t-bench header { padding: 18px 16px 4px; max-width: 900px; margin: 0 auto; font-family: ui-monospace, Consolas, monospace; }
  .t-bench h1 { margin: 0; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; }
  .t-bench #sub { margin: 6px 0 0; color: #a9c7b6; font-size: 12px; }
  .t-bench main { max-width: 900px; margin: 0 auto; padding-bottom: 8px; }
  .t-bench .message, .t-bench footer { color: #a9c7b6; font: 11px ui-monospace, Consolas, monospace; }
  .t-bench footer { text-align: center; padding: 18px 0 22px; }
  .t-bench .stats { display: flex; gap: 8px; padding: 10px 16px 2px; }
  .t-bench .stats div { flex: 1; padding: 8px; background: rgba(0,0,0,.3); border: 1px solid #3f7a5c;
          font: 10px/1.2 ui-monospace, Consolas, monospace; color: #a9c7b6; text-transform: uppercase; }
  .t-bench .stats b { display: block; font-size: 18px; color: #fff; margin-top: 2px; }
  .t-bench .sec { font: 700 11px/1 ui-monospace, Consolas, monospace; letter-spacing: .16em; color: var(--gold); padding: 18px 16px 8px; }
  .t-bench .tray { display: flex; gap: 10px; align-items: center; margin: 0 16px 10px; padding: 8px;
          background: rgba(0,0,0,.28); border: 1px solid #3f7a5c; border-radius: 4px; }
  .t-bench .th { position: relative; width: 84px; height: 105px; flex: none; overflow: hidden; background: #173025; border-radius: 2px; }
  .t-bench .type { color: rgba(255,255,255,.3); font-size: 10px; }
  .t-bench .info { flex: 1; min-width: 0; }
  .t-bench .t { font-weight: 800; font-size: 15px; line-height: 1.15; }
  .t-bench .d { font: 11px/1.3 ui-monospace, Consolas, monospace; color: #a9c7b6; margin-top: 3px; }
  .t-bench .bar { height: 5px; background: #173025; margin-top: 8px; border-radius: 2px; overflow: hidden; }
  .t-bench .bar i { display: block; height: 100%; background: var(--gold); }
  .t-bench .s { font: 700 11px/1 ui-monospace, Consolas, monospace; margin-top: 6px; color: #fff; }
</style>
</head>
<body class="t-classic">
<div class="tape" id="tape" hidden></div>
<header><h1 id="title">Shelf</h1><div id="sub"></div></header>
<main id="shelf"><div class="message">Loading&hellip;</div></main>
<footer>made with Plinth</footer>
<script>
(function () {
  "use strict";
  var API = "https://zntugnlwedaishttqosn.supabase.co";
  var KEY = "sb_publishable_MqNMFLSIKB6f0R2pB0sbnQ_PnKHA3CL"; // publishable: safe to be public
  var CODE = /^[a-hjkmnp-z2-9]{12}$/;
  var PHOTO = /^[A-Za-z0-9-]+\/[A-Za-z0-9-]+\.jpg$/;
  // The themes this page knows. Anything else (or nothing: an older shelf) is Classic.
  var THEMES = { classic: 1, "case": 1, wall: 1, bench: 1 };
  var DOT = " · ";

  var shelf = document.getElementById("shelf");
  var current = null; // the last shelf loaded, so a resize can redraw it

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = String(text);
    return e;
  }

  function message(text) {
    shelf.textContent = "";
    shelf.appendChild(el("div", "message", text));
  }

  // The photo (or the kit type, if there's none) inside [box].
  function picture(box, item) {
    if (typeof item.photo === "string" && PHOTO.test(item.photo)) {
      var img = el("img", "ph");
      img.alt = "";
      img.loading = "lazy";
      img.src = API + "/storage/v1/object/public/shelf/" + item.photo;
      box.appendChild(img);
    } else {
      box.appendChild(el("div", "type", String(item.details || "").split(DOT).pop()));
    }
  }

  function name(item) { return item.title || "Untitled kit"; }
  function stats(item) {
    return [item.stage, item.hours ? item.hours + " of work" : null].filter(Boolean).join("  " + DOT.trim() + "  ");
  }
  // "14.5 h" / "45 min" -> minutes, for the totals.
  function minutes(h) {
    var m = /^([0-9.]+) h$/.exec(h || ""), n = /^([0-9]+) min$/.exec(h || "");
    return m ? parseFloat(m[1]) * 60 : n ? parseInt(n[1], 10) : 0;
  }
  function totalHours(items) {
    var t = items.reduce(function (a, i) { return a + minutes(i.hours); }, 0);
    return Math.round(t / 60);
  }
  // How far along a kit is, 0-100, from "Primed · 4 of 6".
  function progress(item) {
    if (item.finished) return 100;
    var m = /([0-9]+) of ([0-9]+)/.exec(item.stage || "");
    return m && +m[2] > 0 ? Math.min(100, Math.round(100 * m[1] / m[2])) : 0;
  }

  // ---- Classic ----
  function classic(items) {
    items.forEach(function (item) {
      var c = el("article", "card");
      picture(c, item);
      c.appendChild(el("div", "fade"));
      c.appendChild(el("div", item.finished ? "badge done" : "badge", item.finished ? "FINISHED" : "WORK IN PROGRESS"));
      var t = el("div", "text");
      t.appendChild(el("div", "title clamp2", name(item)));
      if (item.details) t.appendChild(el("div", "details one", item.details));
      if (stats(item)) t.appendChild(el("div", "stats one", stats(item)));
      c.appendChild(t);
      shelf.appendChild(c);
    });
  }

  // ---- Display Case ----
  function display(items) {
    var cols = window.matchMedia("(min-width: 700px)").matches ? 4 : 2;
    for (var i = 0; i < items.length; i += cols) {
      var row = el("div", "row");
      row.style.setProperty("--cols", cols);
      items.slice(i, i + cols).forEach(function (item) {
        var it = el("div", "it");
        var frame = el("div", "frame");
        picture(frame, item);
        it.appendChild(frame);
        it.appendChild(el("div", "glow"));
        var label = item.finished ? "FINISHED" : String(item.stage || "").split(DOT)[0].toUpperCase();
        it.appendChild(el("div", item.finished ? "st" : "st w", label));
        it.appendChild(el("div", "nm one", name(item)));
        row.appendChild(it);
      });
      shelf.appendChild(row);
      shelf.appendChild(el("div", "plank"));
    }
  }

  // ---- Gallery Wall ----
  function piece(item) {
    var p = el("div", "piece");
    var frame = el("div", "frame");
    var inner = el("div", "in");
    picture(inner, item);
    frame.appendChild(inner);
    p.appendChild(frame);
    var plaque = el("div", "plaque");
    var left = el("div");
    left.appendChild(el("div", "t", name(item)));
    if (item.details) left.appendChild(el("div", "d", item.details));
    var right = el("div", "s");
    right.appendChild(el("b", null, item.finished ? "Finished" : "In progress"));
    right.appendChild(document.createTextNode(item.hours || ""));
    plaque.appendChild(left);
    plaque.appendChild(right);
    p.appendChild(plaque);
    return p;
  }
  function wall(items) {
    shelf.appendChild(piece(items[0]));
    if (items.length > 1) {
      var small = el("div", "small");
      items.slice(1).forEach(function (item) { small.appendChild(piece(item)); });
      shelf.appendChild(small);
    }
  }

  // ---- Workbench ----
  function tray(item) {
    var t = el("div", "tray");
    var th = el("div", "th");
    picture(th, item);
    t.appendChild(th);
    var info = el("div", "info");
    info.appendChild(el("div", "t", name(item)));
    if (item.details) info.appendChild(el("div", "d", item.details));
    var bar = el("div", "bar");
    var fill = el("i");
    fill.style.width = progress(item) + "%";
    bar.appendChild(fill);
    info.appendChild(bar);
    info.appendChild(el("div", "s", [String(item.stage || "").toUpperCase(), item.hours].filter(Boolean).join(DOT)));
    t.appendChild(info);
    return t;
  }
  function bench(items) {
    var done = items.filter(function (i) { return i.finished; });
    var wip = items.filter(function (i) { return !i.finished; });
    var st = el("div", "stats");
    [["Kits", items.length], ["Finished", done.length], ["Hours", totalHours(items)]].forEach(function (x) {
      var d = el("div", null, x[0]);
      d.appendChild(el("b", null, x[1]));
      st.appendChild(d);
    });
    shelf.appendChild(st);
    if (wip.length) {
      shelf.appendChild(el("div", "sec", "ON THE BENCH"));
      wip.forEach(function (i) { shelf.appendChild(tray(i)); });
    }
    if (done.length) {
      shelf.appendChild(el("div", "sec", "FINISHED"));
      done.forEach(function (i) { shelf.appendChild(tray(i)); });
    }
  }

  var DRAW = { classic: classic, "case": display, wall: wall, bench: bench };

  function draw() {
    var data = current;
    var theme = THEMES[data.theme] === 1 ? data.theme : "classic";
    document.body.className = "t-" + theme;
    document.getElementById("tape").hidden = theme !== "bench";
    var title = typeof data.title === "string" && data.title ? data.title : "Shelf";
    document.getElementById("title").textContent = title;
    document.title = title + DOT + "Plinth";
    var items = data.items.filter(function (i) { return i && typeof i === "object"; });
    var n = items.length;
    var done = items.filter(function (i) { return i.finished; }).length;
    document.getElementById("sub").textContent =
      n + (n === 1 ? " kit" : " kits") + (done ? ", " + done + " finished" : "");
    shelf.textContent = "";
    if (!n) { message("Nothing on this shelf yet."); return; }
    DRAW[theme](items);
  }

  function show(data) {
    if (!data || !Array.isArray(data.items)) {
      message("This shelf isn't here. The link may have been reset or turned off.");
      return;
    }
    current = data;
    draw();
  }

  function load() {
    var code = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
    if (!CODE.test(code)) { message("This link is missing its shelf code. Check you copied all of it."); return; }
    message("Loading…");
    fetch(API + "/rest/v1/rpc/get_shelf", {
      method: "POST",
      headers: { "apikey": KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ p_code: code }),
      referrerPolicy: "no-referrer",
      credentials: "omit"
    })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(show)
      .catch(function () { message("Couldn't load this shelf. Try again in a moment."); });
  }

  window.addEventListener("hashchange", load);
  window.matchMedia("(min-width: 700px)").addEventListener("change", function () { if (current) draw(); });
  load();
})();
</script>
</body>
</html>
